name: kth browser node, wallet support from peers

# TEST ONLY branch, never merged. The browser-worker job of kth's own
# build-wasm.yml, run on a kth tree carried by scripts/kth-peer-path.bundle
# (CyberAshven/kth restack/11-browser, not pushed yet): the browser node
# built with neutrino and wallet, the controls compiled, and every control
# run as real WASM in Chromium Workers, the wallet control among them.
on:
  push:
    branches: [e2e/wallet-peer-path]
  workflow_dispatch:

permissions:
  contents: read

env:
  CONAN_REMOTE: kth
  CONAN_REMOTE_URL: https://packages.kth.cash/api/

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: r11-browser
            branch: restack/11-browser
    name: kth ${{ matrix.name }} browser controls
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch kth ${{ matrix.branch }}
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/CyberAshven/kth.git kth-src
          git -C kth-src fetch --quiet https://github.com/k-nuth/kth.git master
          git -C kth-src fetch --quiet "$PWD/scripts/kth-peer-path.bundle" "refs/heads/*:refs/bundle/*"
          git -C kth-src checkout --quiet --detach "refs/bundle/${{ matrix.branch }}"
          git -C kth-src log -1 --format='%H %s' | tee kth-commit.txt
        shell: bash
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build and browser test dependencies
        run: |
          python -m pip install conan==2.31.2 kthbuild playwright==1.55.0 websockets==15.0.1
          python -m playwright install --with-deps chromium
          conan profile detect --force
          git clone https://github.com/conan-io/conan-toolchains.git "$RUNNER_TEMP/conan-toolchains"
          git -C "$RUNNER_TEMP/conan-toolchains" checkout --detach 11b83330cdeb20622fe4b097dccb254969639a54
          conan remote add conan-toolchains "$RUNNER_TEMP/conan-toolchains"
          conan remote add "$CONAN_REMOTE" "$CONAN_REMOTE_URL" --force
        shell: bash
      - name: No raw Asio timers in code the browser compiles
        working-directory: kth-src
        run: python3 scripts/check_browser_timers.py
      - name: Browser recipe
        working-directory: kth-src
        run: python3 -m unittest scripts/test_browser_recipe.py
      - name: Configure browser_node=True with neutrino and wallet, and compile the controls
        working-directory: kth-src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/browser-results
          conan install . --version=1.5.2 \
            --output-folder=build/browser-deps --lockfile=conan-wasm.lock --lockfile-partial \
            -pr:h ci_utils/conan/profiles/ems6 --build=missing \
            -o browser_node=True -o tests=False -o rpc=none -o consensus=False -o neutrino=True -o wallet=True \
            2>&1 | tee build/browser-results/dependencies.log
          source build/browser-deps/build/Release/generators/conanbuild.sh
          cmake -S . -B build/browser -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/browser-deps/build/Release/generators/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_NODE_EXE=OFF -DBUILD_C_API=ON \
            -DKTH_BROWSER_NODE=ON -DKTH_BROWSER_CONTROLS=ON \
            2>&1 | tee build/browser-results/configure.log
          cmake --build build/browser --parallel 4 --target \
            browser_stream_control browser_cap_control browser_eof_control \
            browser_select_control browser_terminal_control browser_headers_control browser_persist_control browser_peers_control browser_content_control \
            browser_wallet_control \
            2>&1 | tee build/browser-results/build.log
      - name: Run real WASM in Chromium Workers
        working-directory: kth-src
        shell: bash
        run: |
          set -euo pipefail
          python experiments/browser-worker/ci.py build/browser/experiments/browser-worker \
            --report build/browser-results/workers.json 2>&1 | tee build/browser-results/workers.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kth-${{ matrix.name }}-browser
          path: |
            kth-commit.txt
            kth-src/build/browser-results
          if-no-files-found: warn
