name: kth rows from #773, build, tests and client checks

# TEST ONLY branch, never merged. For each fork branch of CyberAshven/kth that
# carries a row of k-nuth/kth#773, and for upstream master as the baseline:
# build kth with its tests from kth's own recipe and toolchain image, run kth's
# node test suite (and the domain suite where the branch changes the domain
# library), then put that kth into the package image and run
# scripts/knuth_rpc_e2e.py, whose "#773 rows" section is each client's own
# check of its row. It runs when this file changes, or by hand.
on:
  push:
    branches: [knuth-rpc-e2e]
    paths: [.github/workflows/kth-rows.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  row:
    strategy:
      fail-fast: false
      matrix:
        include:
        # #817's engine keeps the tip's recent jobs valid (sv2/keep-tip-jobs at
        # 04c27bce), and the fee refresh on top (sv2/fee-refresh at b8a53b95),
        # each with RED: its change taken out, the tests kept.
          - name: 817-keep-tip-jobs
            branch: test/817-keep-tip-jobs
            sv2: true
            noise: true
            sv2_mining: true
          - name: 817-keep-tip-jobs-red
            branch: test/817-keep-tip-jobs-red3
            sv2: true
            noise: true
            sv2_mining: true
          - name: fee-refresh
            branch: test/fee-refresh
            sv2: true
            noise: true
            sv2_mining: true
          - name: fee-refresh-red
            branch: test/fee-refresh-red3
            sv2: true
            noise: true
            sv2_mining: true
        # SV2 extension 0x0002 on #833 (sv2/worker-hashrate at a253a4e4): the
        # Mining server reads worker names; the JD client sends them only to
        # upstreams on the same machine or marked as the operator's own.
          - name: sv2-0002
            branch: test/sv2-0002
            sv2: true
            noise: true
            sv2_mining: true
    name: kth ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # GCC 15 for branches on master before #865; GCC 16.2 from it on.
      IMAGE: ${{ matrix.gcc == '16' && 'kthnode/gcc16-ubuntu24.04@sha256:cde0d8a8b911ba290e4019fa4fac81723c7cae93cd864e509fd93a7c05d25dfe' || 'kthnode/gcc15-ubuntu24.04@sha256:4988fdeb3654c2b5ea591ffa4454f67e1a631549449c62e35060ba69da79eb67' }}
      GCC: ${{ matrix.gcc || '15' }}
      CCACHE_PREFIX: kth-ccache-${{ matrix.gcc == '16' && 'gcc16-' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Make room for the build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        shell: bash
      - name: Fetch kth ${{ matrix.branch }}
        run: |
          git clone --depth 1 --branch "${{ matrix.branch }}" https://github.com/CyberAshven/kth.git kth-src
          git -C kth-src log -1 --format='%H %s' | tee kth-commit.txt
        shell: bash
      # The packages kth depends on (boost alone took 9 of the 13 minutes),
      # kept between runs and keyed on kth's lock file, as kth's own CI does.
      - name: Restore the Conan packages
        id: restore-conan
        uses: actions/cache/restore@v6
        with:
          path: conan2
          key: kth-conan2-gcc${{ env.GCC }}-${{ hashFiles('kth-src/conan.lock', 'kth-src/conanfile.py') }}
          restore-keys: |
            kth-conan2-gcc${{ env.GCC }}-
      # Per branch, so a re-run of the same branch finds its own objects; any
      # branch's cache otherwise, which is mostly master's code.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: ${{ env.CCACHE_PREFIX }}${{ matrix.branch }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CCACHE_PREFIX }}${{ matrix.branch }}-
            ${{ env.CCACHE_PREFIX }}
      - name: Build kth and its tests in the kth toolchain
        run: |
          TARGETS="kth_node_test node-exe"
          if [ "${{ matrix.domain }}" = "true" ]; then TARGETS="$TARGETS kth_domain_test"; fi
          if [ "${{ matrix.capi }}" = "true" ]; then TARGETS="$TARGETS kth_capi_test"; fi
          if [ "${{ matrix.blockchain }}" = "true" ]; then TARGETS="$TARGETS kth_blockchain_test"; fi
          if [ "${{ matrix.network }}" = "true" ]; then TARGETS="$TARGETS kth_network_test"; fi
          if [ "${{ matrix.infrastructure }}" = "true" ]; then TARGETS="$TARGETS kth_infrastructure_test"; fi
          mkdir -p ccache conan2
          # 4 GB: the whole build with its tests overflowed 1.2 GB (65 of 545
          # hits). The sources are cloned fresh, so their times are new and
          # only their contents can be trusted.
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -v "$PWD/ccache:/ccache" \
            -v "$PWD/conan2:/root/.conan2" -w /src \
            -e TARGETS="$TARGETS" -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=4G -e CCACHE_BASEDIR=/src \
            -e CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros "$IMAGE" \
            bash -euo pipefail -c '
              LAUNCH=""
              if command -v ccache >/dev/null || (apt-get update -qq && apt-get install -y -qq ccache >/dev/null); then
                LAUNCH="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
                ccache -z
              fi
              pip install --no-cache-dir --upgrade "conan>=2.25,<3" "kthbuild>=4,<5"
              conan profile detect --force
              conan remote add kth https://packages.kth.cash/api/ --force
              time conan install conanfile.py --version 1.5.2 -of build --build=missing \
                -o currency=BCH -o rpc=True -o tests=True \
                -o "utxoz/*:with_tests=False" -o "utxoz/*:with_benchmarks=False" \
                -o "utxoz/*:with_large_benchmarks=False" \
                -s compiler.cppstd=23 -s build_type=Release
              cmake --preset conan-release -DGLOBAL_BUILD=ON -DENABLE_TEST=ON -DCMAKE_BUILD_TYPE=Release $LAUNCH
              time cmake --build --preset conan-release -j"$(nproc)" --target $TARGETS
              if [ -n "$LAUNCH" ]; then ccache -s; fi
              # Only the built packages are worth keeping, not their build trees.
              conan cache clean "*" --source --build --download --temp || true
              du -sh /root/.conan2 /ccache || true
              chmod -R a+rwX /ccache /root/.conan2
            '
        shell: bash
      - name: Save the Conan packages
        if: always() && steps.restore-conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: conan2
          key: kth-conan2-gcc${{ env.GCC }}-${{ hashFiles('kth-src/conan.lock', 'kth-src/conanfile.py') }}
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ccache
          key: ${{ env.CCACHE_PREFIX }}${{ matrix.branch }}-${{ github.run_id }}
      - name: Run kth's node test suite
        run: |
          TEST=$(find kth-src/build -name kth_node_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1200 ./kth_node_test --reporter compact" > node-tests.log 2>&1
          rc=$?
          tail -n 40 node-tests.log
          # The failed assertions themselves, so they read in the job log.
          grep -n "failed:" node-tests.log | head -40 || true
          echo "kth_node_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run kth's domain test suite
        if: matrix.domain
        run: |
          TEST=$(find kth-src/build -name kth_domain_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1800 ./kth_domain_test --reporter compact" > domain-tests.log 2>&1
          rc=$?
          tail -n 40 domain-tests.log
          echo "kth_domain_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run kth's C API test suite
        if: matrix.capi
        run: |
          TEST=$(find kth-src/build -name kth_capi_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1800 ./kth_capi_test --reporter compact" > capi-tests.log 2>&1
          rc=$?
          tail -n 40 capi-tests.log
          echo "kth_capi_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run kth's blockchain test suite
        if: matrix.blockchain
        run: |
          TEST=$(find kth-src/build -name kth_blockchain_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1200 ./kth_blockchain_test --reporter compact" > blockchain-tests.log 2>&1
          rc=$?
          tail -n 40 blockchain-tests.log
          echo "kth_blockchain_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run kth's infrastructure test suite
        if: matrix.infrastructure
        run: |
          TEST=$(find kth-src/build -name kth_infrastructure_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE"             bash -c "timeout --kill-after=30 1200 ./kth_infrastructure_test --reporter compact" > infrastructure-tests.log 2>&1
          rc=$?
          tail -n 40 infrastructure-tests.log
          echo "kth_infrastructure_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run kth's network test suite
        if: matrix.network
        run: |
          TEST=$(find kth-src/build -name kth_network_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1200 ./kth_network_test --reporter compact" > network-tests.log 2>&1
          rc=$?
          tail -n 40 network-tests.log
          echo "kth_network_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Restore the package image
        id: image
        uses: actions/cache/restore@v6
        with:
          path: /tmp/knuth-e2e.tar
          key: knuth-e2e-${{ hashFiles('Dockerfile') }}
      - name: Put this kth into the package image
        run: |
          KTH=$(find kth-src/build -name kth -type f -perm -u+x -path '*node-exe*' | head -1)
          echo "node binary: $KTH"
          cp "$KTH" kth-built
          # The kept image carries GCC 15's C++ runtime; a GCC 16 kth needs its own.
          if [ "${{ steps.image.outputs.cache-hit }}" = "true" ] && [ "$GCC" = "15" ]; then
            docker load -i /tmp/knuth-e2e.tar
            printf 'FROM knuth-e2e\nCOPY kth-built /usr/local/bin/kth\n' > Dockerfile.built
          else
            # The kept image was evicted (each row's compiler cache is about 1 GB).
            # Build the package's own runtime stage around this kth instead. That
            # stage takes only the C++ runtime from the build stage, and
            # the toolchain image already holds it, so nothing compiles twice.
            echo "building the package's runtime stage on the GCC $GCC toolchain"
            { echo "FROM --platform=linux/amd64 $IMAGE AS kth-build"
              awk '/^# ── Runtime/,0' Dockerfile \
                | sed 's#^COPY --from=kth-build /deploy/direct_deploy/kth/bin/kth /usr/local/bin/kth$#COPY kth-built /usr/local/bin/kth#'
            } > Dockerfile.built
            grep -q '^COPY kth-built /usr/local/bin/kth$' Dockerfile.built
          fi
          docker build --platform linux/amd64 -f Dockerfile.built -t knuth-e2e .
        shell: bash
      - name: Fetch BCHN 29.2.0
        run: |
          TARBALL=bitcoin-cash-node-29.2.0-x86_64-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/v29.2.0/$TARBALL"
          echo "23bbe9ff749136a9b832a2a59023ce76a5391322c1ea2f4f24b5b91f035081bc  $TARBALL" | sha256sum -c
          tar xzf "$TARBALL"
          echo "$PWD/bitcoin-cash-node-29.2.0/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Build the Stratum V2 Noise bridge (SRI crates)
        if: matrix.noise
        run: cargo build --release --locked --manifest-path scripts/sv2-noise-bridge/Cargo.toml
        shell: bash
      - name: Build SRI's mining_device (sv2-apps, pinned)
        if: matrix.sv2_mining
        run: |
          sudo apt-get install -y -qq capnproto libcapnp-dev >/dev/null
          git clone --quiet https://github.com/stratum-mining/sv2-apps.git sv2-apps
          git -C sv2-apps checkout --quiet ffad32eb11128b8e3cf9ff20604480c11e5cbfab
          cargo build --release --locked --manifest-path sv2-apps/Cargo.toml -p integration_tests_sv2 --bin mining_device
        shell: bash
      - name: Run the end-to-end checks against this kth
        run: python3 scripts/knuth_rpc_e2e.py e2e-out
        env:
          KTH_SV2: ${{ matrix.sv2 && '1' || '0' }}
          KTH_NOISE: ${{ matrix.noise && '1' || '0' }}
          KTH_I2P: ${{ matrix.i2p && '1' || '0' }}
          KTH_SERVE: ${{ matrix.serve && '1' || '0' }}
          KTH_ANNOUNCE: ${{ matrix.announce && '1' || '0' }}
          KTH_COMPACT: ${{ matrix.compact && '1' || '0' }}
          KTH_SV2_MINING: ${{ matrix.sv2_mining && '1' || '0' }}
          KTH_LONGPOLL: ${{ matrix.longpoll && '1' || '0' }}
          KTH_PROXY: ${{ matrix.proxy && '1' || '0' }}
          KTH_SHV: ${{ matrix.shv && '1' || '0' }}
          KTH_STALL: ${{ matrix.stall && '1' || '0' }}
          KTH_LONG: ${{ matrix.long || '0' }}
        shell: bash
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kth-${{ matrix.name }}
          path: |
            kth-commit.txt
            test-status.txt
            node-tests.log
            domain-tests.log
            capi-tests.log
            blockchain-tests.log
            network-tests.log
            infrastructure-tests.log
            e2e-out
          if-no-files-found: ignore
      - name: Fail when a kth test suite failed
        run: |
          cat test-status.txt
          ! grep -v ' exit 0$' test-status.txt
        shell: bash
