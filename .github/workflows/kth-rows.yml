name: kth rows from #773, build, tests and client checks

# TEST ONLY branch, never merged. For each fork branch of CyberAshven/kth that
# carries a row of k-nuth/kth#773, and for upstream master as the baseline:
# build kth with its tests from kth's own recipe and toolchain image, run kth's
# node test suite (and the domain suite where the branch changes the domain
# library), then put that kth into the package image and run
# scripts/knuth_rpc_e2e.py, whose "#773 rows" section is each client's own
# check of its row. It runs when this file changes, or by hand.
on:
  push:
    # Wallet support from peers on the regular filter (type 0) and the input
    # prefix filter (type 2), CyberAshven/kth restack/6 to restack/11: every
    # push of this branch.
    branches: [e2e/wallet-peer-path]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  row:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The peer path of wallet support without filter type 1. Branches
          # not pushed yet come from scripts/kth-peer-path.bundle (bundle:
          # true), on top of what the fork and k-nuth/kth master hold.
          - name: r7-filter-files
            branch: restack/7-filter-files
            bundle: true
            gcc: '16'
            options: -o neutrino=True -o wallet=True
            targets: kth_node_wallet_test
            suites: kth_node_wallet_test
            e2e: false
          - name: r8-scan
            branch: restack/8-scan
            bundle: true
            gcc: '16'
            options: -o neutrino=True -o wallet=True
            targets: kth_domain_neutrino_test kth_node_wallet_test
            suites: kth_domain_neutrino_test kth_node_wallet_test
            e2e: false
          - name: r9-block-checks
            branch: restack/9-block-checks
            bundle: true
            gcc: '16'
            options: -o neutrino=True -o wallet=True
            targets: kth_domain_neutrino_test kth_node_wallet_test
            suites: kth_domain_neutrino_test kth_node_wallet_test
            e2e: false
          - name: r10-peers
            branch: restack/10-peers
            bundle: true
            gcc: '16'
            options: -o neutrino=True -o wallet=True
            targets: kth_domain_neutrino_test kth_node_neutrino_test kth_node_wallet_test
            suites: kth_domain_neutrino_test kth_node_neutrino_test kth_node_wallet_test
            e2e: false
          # End to end: restack/10 with the type 2 serving of
          # node/input-prefix-filter-index and the node's Electrum listener of
          # restack/3 merged in (TEST ONLY tree e2e/peer-path-node, in the
          # bundle), and the harness's peer wallet driver built in it. kth
          # serves types 0 and 2 to the driver, bchd (gcash/bchd#785) too; row
          # 1017 compares the driver's answers with BCHN's blocks and the
          # node's own wallet support, before and after a reorganization.
          - name: e2e-peer-path
            branch: e2e/peer-path-node
            bundle: true
            gcc: '16'
            options: -o neutrino=True -o wallet=True
            targets: kth_node_wallet_test kth_peer_wallet_e2e
            suites: kth_node_wallet_test
            e2e: true
            filters: true
            rpa_filters: true
            neutrino: true
            bchd: true
            node_wallet: true
            peer_wallet: true
            long: 2100
    name: kth ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # GCC 15 for branches on master before #865; GCC 16.2 from it on. The
      # toolchain is this Docker Hub digest; the steps take the repo's copy of
      # it (ci-deps.yml) when that copy's label carries the same digest, and
      # set IMAGE to the one they use.
      HUB_IMAGE: ${{ matrix.gcc == '16' && 'kthnode/gcc16-ubuntu24.04@sha256:cde0d8a8b911ba290e4019fa4fac81723c7cae93cd864e509fd93a7c05d25dfe' || 'kthnode/gcc15-ubuntu24.04@sha256:4988fdeb3654c2b5ea591ffa4454f67e1a631549449c62e35060ba69da79eb67' }}
      GCC: ${{ matrix.gcc || '15' }}
      CCACHE_PREFIX: kth-ccache-${{ matrix.gcc == '16' && 'gcc16-' || '' }}
      # Copies of BCHN, the toolchains and kth's Conan packages (ci-deps.yml).
      CI_DEPS: ghcr.io/bitcoincash1/knuth-ci-deps
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Make room for the build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        shell: bash
      # Without it every copy below is missing, and each falls back.
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pick the toolchain image
        run: |
          COPY="$CI_DEPS:toolchain-gcc$GCC"
          IMAGE="$HUB_IMAGE"
          if docker pull --quiet --platform linux/amd64 "$COPY" \
            && [ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$COPY")" = "${HUB_IMAGE#*@}" ]; then
            IMAGE="$COPY"
          else
            echo "no copy of $HUB_IMAGE in $CI_DEPS; using Docker Hub's"
            docker rmi "$COPY" >/dev/null 2>&1 || true
          fi
          echo "toolchain image: $IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        shell: bash
      - name: Fetch kth ${{ matrix.branch }}
        run: |
          if [ "${{ matrix.bundle }}" = "true" ]; then
            # The branch as the bundle holds it, on the fork and k-nuth/kth master.
            git clone --quiet --filter=blob:none --no-checkout https://github.com/CyberAshven/kth.git kth-src
            git -C kth-src fetch --quiet https://github.com/k-nuth/kth.git master
            git -C kth-src fetch --quiet "$PWD/scripts/kth-peer-path.bundle" "refs/heads/*:refs/bundle/*"
            git -C kth-src checkout --quiet --detach "refs/bundle/${{ matrix.branch }}"
          else
            git clone --depth 1 --branch "${{ matrix.branch }}" https://github.com/CyberAshven/kth.git kth-src
          fi
          git -C kth-src log -1 --format='%H %s' | tee kth-commit.txt
        shell: bash
      # The packages ci-deps.yml keeps for this lock file and compiler: the
      # build restores them into the Conan cache, and conan install then finds
      # everything there without the package registry. Without them the build
      # goes on as before, from the actions cache below and the registry.
      - name: Fetch the kept Conan packages
        run: |
          mkdir -p conan2
          if HASH=$(cat kth-src/conan.lock kth-src/conanfile.py | sha256sum | cut -d' ' -f1); then
            REF="$CI_DEPS:conan-gcc$GCC-$HASH"
            if docker pull --quiet "$REF" && id=$(docker create "$REF" /x); then
              docker cp "$id:/kth-conan.tgz" conan2/kth-conan.tgz || rm -f conan2/kth-conan.tgz
              docker rm "$id" >/dev/null || true
            fi
            docker rmi "$REF" >/dev/null 2>&1 || true
          fi
          if [ -f conan2/kth-conan.tgz ]; then
            echo "Conan packages from $REF"
          else
            echo "no kept Conan packages for this lock file; using the actions cache and the registry"
          fi
        shell: bash
      # The packages kth depends on (boost alone took 9 of the 13 minutes),
      # kept between runs and keyed on kth's lock file, as kth's own CI does.
      - name: Restore the Conan packages
        id: restore-conan
        uses: actions/cache/restore@v6
        with:
          path: conan2
          key: kth-conan2v2-gcc${{ env.GCC }}-${{ hashFiles('kth-src/conan.lock', 'kth-src/conanfile.py') }}
          restore-keys: |
            kth-conan2v2-gcc${{ env.GCC }}-
      # Per branch, so a re-run of the same branch finds its own objects; any
      # branch's cache otherwise, which is mostly master's code.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: ${{ env.CCACHE_PREFIX }}${{ matrix.branch }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CCACHE_PREFIX }}${{ matrix.branch }}-
            ${{ env.CCACHE_PREFIX }}
      # Row 1017: the harness's driver of wallet support from peers, built
      # in this kth tree as one more executable of the node.
      - name: Add the peer wallet driver to the kth tree
        if: matrix.peer_wallet
        run: |
          mkdir -p kth-src/src/node/e2e
          cp scripts/kth-peer-wallet/peer_wallet_e2e.cpp kth-src/src/node/e2e/
          printf '%s\n' '' \
            'if(KTH_WITH_WALLET AND NOT CMAKE_SYSTEM_NAME STREQUAL "Emscripten")' \
            '  add_executable(kth_peer_wallet_e2e e2e/peer_wallet_e2e.cpp)' \
            '  target_link_libraries(kth_peer_wallet_e2e PRIVATE ${PROJECT_NAME})' \
            'endif()' >> kth-src/src/node/CMakeLists.txt
          tail -6 kth-src/src/node/CMakeLists.txt
        shell: bash
      - name: Build kth and its tests in the kth toolchain
        run: |
          TARGETS="kth_node_test node-exe"
          if [ "${{ matrix.domain }}" = "true" ]; then TARGETS="$TARGETS kth_domain_test"; fi
          if [ "${{ matrix.capi }}" = "true" ]; then TARGETS="$TARGETS kth_capi_test"; fi
          if [ "${{ matrix.blockchain }}" = "true" ]; then TARGETS="$TARGETS kth_blockchain_test"; fi
          if [ "${{ matrix.network }}" = "true" ]; then TARGETS="$TARGETS kth_network_test"; fi
          if [ "${{ matrix.infrastructure }}" = "true" ]; then TARGETS="$TARGETS kth_infrastructure_test"; fi
          if [ "${{ matrix.wallet }}" = "true" ]; then TARGETS="$TARGETS kth-wallet"; fi
          # The optional features' own test executables, and the Conan options that build them.
          if [ -n "${{ matrix.targets }}" ]; then TARGETS="$TARGETS ${{ matrix.targets }}"; fi
          mkdir -p ccache conan2
          # 4 GB: the whole build with its tests overflowed 1.2 GB (65 of 545
          # hits). The sources are cloned fresh, so their times are new and
          # only their contents can be trusted.
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -v "$PWD/ccache:/ccache" \
            -v "$PWD/conan2:/root/.conan2" -w /src \
            -e TARGETS="$TARGETS" -e OPTS="${{ matrix.options }}" -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=4G -e CCACHE_BASEDIR=/src \
            -e CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros "$IMAGE" \
            bash -euo pipefail -c '
              LAUNCH=""
              if command -v ccache >/dev/null || (apt-get update -qq && apt-get install -y -qq ccache >/dev/null); then
                LAUNCH="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
                ccache -z
              fi
              pip install --no-cache-dir --upgrade "conan>=2.25,<3" "kthbuild>=4,<5"
              conan profile detect --force
              # The package registry has short outages; retry instead of failing the run.
              printf "core.net.http:max_retries=8\ncore.net.http:timeout=60\n" >> "$(conan config home)/global.conf"
              conan remote add kth https://packages.kth.cash/api/ --force
              # The kept packages, when the step above found them.
              if [ -f /root/.conan2/kth-conan.tgz ]; then
                conan cache restore /root/.conan2/kth-conan.tgz >/dev/null \
                  || echo "restoring the kept Conan packages failed; conan install uses the registry"
                rm -f /root/.conan2/kth-conan.tgz
              fi
              # Since k-nuth/kth#794 the rpc option names a backend; older
              # branches still take True.
              RPC=True
              if grep -q -F "\"rpc\": [\"jsonrpc\"" conanfile.py; then RPC=jsonrpc; fi
              time conan install conanfile.py --version 1.5.2 -of build --build=missing \
                -o currency=BCH -o rpc=$RPC -o tests=True $OPTS \
                -o "utxoz/*:with_tests=False" -o "utxoz/*:with_benchmarks=False" \
                -o "utxoz/*:with_large_benchmarks=False" \
                -s compiler.cppstd=23 -s build_type=Release
              cmake --preset conan-release -DGLOBAL_BUILD=ON -DENABLE_TEST=ON -DCMAKE_BUILD_TYPE=Release $LAUNCH
              # Every compile error of a run in one log: the build goes on past a failed file.
              KEEP="-k"
              if grep -qs "^CMAKE_GENERATOR:INTERNAL=Ninja" $(find build -name CMakeCache.txt | head -1); then KEEP="-k 0"; fi
              time cmake --build --preset conan-release -j"$(nproc)" --target $TARGETS -- $KEEP
              if [ -n "$LAUNCH" ]; then ccache -s; fi
              # Only the built packages are worth keeping, not their build trees.
              conan cache clean "*" --source --build --download --temp || true
              du -sh /root/.conan2 /ccache || true
              chmod -R a+rwX /ccache /root/.conan2
            '
        shell: bash
      - name: Save the Conan packages
        if: success() && steps.restore-conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: conan2
          key: kth-conan2v2-gcc${{ env.GCC }}-${{ hashFiles('kth-src/conan.lock', 'kth-src/conanfile.py') }}
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ccache
          key: ${{ env.CCACHE_PREFIX }}${{ matrix.branch }}-${{ github.run_id }}
      - name: Run kth's node test suite
        run: |
          TEST=$(find kth-src/build -name kth_node_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1200 ./kth_node_test --reporter compact" > node-tests.log 2>&1
          rc=$?
          tail -n 40 node-tests.log
          # The failed assertions themselves, so they read in the job log.
          grep -n "failed:" node-tests.log | head -40 || true
          # The wallet support's birthday scan timings, both ways.
          grep -n "wallet birthday scan" node-tests.log || true
          echo "kth_node_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run the optional features' test suites
        if: matrix.suites
        run: |
          for SUITE in ${{ matrix.suites }}; do
            TEST=$(find kth-src/build -name "$SUITE" -type f -perm -u+x | head -1)
            echo "test binary: $TEST"
            if [ -z "$TEST" ]; then echo "$SUITE exit 127" | tee -a test-status.txt; continue; fi
            set +e
            docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE"               bash -c "timeout --kill-after=30 1800 ./$SUITE --reporter compact" > "$SUITE.log" 2>&1
            rc=$?
            set -e
            tail -n 40 "$SUITE.log"
            grep -n "failed:" "$SUITE.log" | head -40 || true
            grep -n "wallet birthday scan" "$SUITE.log" || true
            echo "$SUITE exit $rc" | tee -a test-status.txt
          done
        shell: bash
      - name: Run kth's domain test suite
        if: matrix.domain
        run: |
          TEST=$(find kth-src/build -name kth_domain_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1800 ./kth_domain_test --reporter compact" > domain-tests.log 2>&1
          rc=$?
          tail -n 40 domain-tests.log
          echo "kth_domain_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run kth's C API test suite
        if: matrix.capi
        run: |
          TEST=$(find kth-src/build -name kth_capi_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1800 ./kth_capi_test --reporter compact" > capi-tests.log 2>&1
          rc=$?
          tail -n 40 capi-tests.log
          echo "kth_capi_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run kth's blockchain test suite
        if: matrix.blockchain
        run: |
          TEST=$(find kth-src/build -name kth_blockchain_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1200 ./kth_blockchain_test --reporter compact" > blockchain-tests.log 2>&1
          rc=$?
          tail -n 40 blockchain-tests.log
          echo "kth_blockchain_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run kth's infrastructure test suite
        if: matrix.infrastructure
        run: |
          TEST=$(find kth-src/build -name kth_infrastructure_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE"             bash -c "timeout --kill-after=30 1200 ./kth_infrastructure_test --reporter compact" > infrastructure-tests.log 2>&1
          rc=$?
          tail -n 40 infrastructure-tests.log
          echo "kth_infrastructure_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Run kth's network test suite
        if: matrix.network
        run: |
          TEST=$(find kth-src/build -name kth_network_test -type f -perm -u+x | head -1)
          echo "test binary: $TEST"
          set +e
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1200 ./kth_network_test --reporter compact" > network-tests.log 2>&1
          rc=$?
          tail -n 40 network-tests.log
          echo "kth_network_test exit $rc" | tee -a test-status.txt
        shell: bash
      - name: Restore the package image
        if: matrix.e2e != false
        id: image
        uses: actions/cache/restore@v6
        with:
          path: /tmp/knuth-e2e.tar
          key: knuth-e2e-${{ hashFiles('Dockerfile') }}
      - name: Put this kth into the package image
        if: matrix.e2e != false
        run: |
          KTH=$(find kth-src/build -name kth -type f -perm -u+x -path '*node-exe*' | head -1)
          echo "node binary: $KTH"
          cp "$KTH" kth-built
          # The kept image carries GCC 15's C++ runtime; a GCC 16 kth needs its own.
          if [ "${{ steps.image.outputs.cache-hit }}" = "true" ] && [ "$GCC" = "15" ]; then
            docker load -i /tmp/knuth-e2e.tar
            printf 'FROM knuth-e2e\nCOPY kth-built /usr/local/bin/kth\n' > Dockerfile.built
          else
            # The kept image was evicted (each row's compiler cache is about 1 GB).
            # Build the package's own runtime stage around this kth instead. That
            # stage takes only the C++ runtime from the build stage, and
            # the toolchain image already holds it, so nothing compiles twice.
            echo "building the package's runtime stage on the GCC $GCC toolchain"
            { echo "FROM --platform=linux/amd64 $IMAGE AS kth-build"
              awk '/^# ── Runtime/,0' Dockerfile \
                | sed 's#^COPY --from=kth-build /deploy/direct_deploy/kth/bin/kth /usr/local/bin/kth$#COPY kth-built /usr/local/bin/kth#'
            } > Dockerfile.built
            grep -q '^COPY kth-built /usr/local/bin/kth$' Dockerfile.built
          fi
          docker build --platform linux/amd64 -f Dockerfile.built -t knuth-e2e .
        shell: bash
      - name: Fetch BCHN 29.2.0
        if: matrix.e2e != false
        run: |
          TARBALL=bitcoin-cash-node-29.2.0-x86_64-linux-gnu.tar.gz
          SHA256=23bbe9ff749136a9b832a2a59023ce76a5391322c1ea2f4f24b5b91f035081bc
          # The repo's copy (ci-deps.yml) first, then BCHN's release.
          if docker pull --quiet "$CI_DEPS:bchn-29.2.0" && id=$(docker create "$CI_DEPS:bchn-29.2.0" /x); then
            docker cp "$id:/$TARBALL" . || true
            docker rm "$id" >/dev/null || true
          fi
          if ! echo "$SHA256  $TARBALL" | sha256sum -c; then
            echo "no good copy in $CI_DEPS; fetching BCHN's release"
            rm -f "$TARBALL"
            curl -fsSLO --retry 6 --retry-delay 10 --retry-all-errors "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/v29.2.0/$TARBALL"
            echo "$SHA256  $TARBALL" | sha256sum -c
          fi
          tar xzf "$TARBALL"
          echo "$PWD/bitcoin-cash-node-29.2.0/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Build the Stratum V2 Noise bridge (SRI crates)
        if: matrix.noise
        run: cargo build --release --locked --manifest-path scripts/sv2-noise-bridge/Cargo.toml
        shell: bash
      - name: Build SRI's mining_device (sv2-apps, pinned)
        if: matrix.sv2_mining
        run: |
          sudo apt-get install -y -qq capnproto libcapnp-dev >/dev/null
          git clone --quiet https://github.com/stratum-mining/sv2-apps.git sv2-apps
          git -C sv2-apps checkout --quiet ffad32eb11128b8e3cf9ff20604480c11e5cbfab
          cargo build --release --locked --manifest-path sv2-apps/Cargo.toml -p integration_tests_sv2 --bin mining_device
        shell: bash
      - name: Build the Neutrino wallet client
        if: matrix.neutrino
        run: |
          # The gcash/neutrino library itself, pinned in scripts/neutrino-client/go.mod.
          cd scripts/neutrino-client
          go build -o "$GITHUB_WORKSPACE/neutrino-client" .
        shell: bash
      # Row 1016: the bchd that serves filter type 2, gcash/bchd#785 at its
      # head, which pins gcash/bchutil script-rpa-all (bcad7d1) in its go.mod.
      - name: Build bchd (gcash/bchd#785)
        if: matrix.bchd
        run: |
          git init --quiet bchd-src
          git -C bchd-src fetch --quiet --depth 1 https://github.com/CyberAshven/bchd.git 8c0deaff5707459e82738e036eccd7b5f86a87d1
          git -C bchd-src checkout --quiet FETCH_HEAD
          git -C bchd-src log -1 --format='%H %s' | tee bchd-commit.txt
          cd bchd-src
          go build -o "$GITHUB_WORKSPACE/bchd" .
        shell: bash
      # Row 1016: the Neutrino library's RPA search, gcash/neutrino#56 at its
      # head, pinned in scripts/rpa-neutrino-client/go.mod.
      - name: Build the Neutrino RPA search client
        if: matrix.bchd
        run: |
          cd scripts/rpa-neutrino-client
          go build -o "$GITHUB_WORKSPACE/rpa-neutrino-client" .
        shell: bash
      # Row 1008: the BCH Explorer's 'p2p' backend as a light client of kth.
      # Only its light client (dist/api/bitcoin/p2p and what that imports) is
      # compiled; the rest of the backend needs the native GBT addon, which
      # the light client does not use. The backend requires Node.js 26.
      - name: Set up Node.js for the BCH Explorer
        if: matrix.explorer_p2p
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Build the BCH Explorer's p2p light client
        if: matrix.explorer_p2p
        run: |
          git clone --depth 1 --branch "${{ matrix.explorer_branch || 'feat/p2p-light-client' }}" \
            https://github.com/CyberAshven/bitcoin-cash-explorer.git explorer
          git -C explorer log -1 --format='%H %s' | tee explorer-commit.txt
          cd explorer/backend
          # The lock file names the native addon as file:rust-gbt; a stub stands in for it.
          mkdir -p rust-gbt
          cp ../rust/gbt/package.json rust-gbt/
          echo 'module.exports = {};' > rust-gbt/index.js
          npx --yes pnpm@12.18.0 install --frozen-lockfile --ignore-scripts
          npx tsc --outDir dist --rootDir src --module commonjs --target es2022 --moduleResolution node \
            --esModuleInterop --skipLibCheck --types node src/api/bitcoin/p2p/*.ts
          ls dist/api/bitcoin/p2p
        shell: bash
      # Row 1011: kth's wallet support answered from peers, as kth-wallet,
      # run in the image it was built in.
      - name: Find kth-wallet
        if: matrix.wallet
        run: |
          WALLET=$(find kth-src/build -name kth-wallet -type f -perm -u+x | head -1)
          echo "kth-wallet: $WALLET"
          echo "KTH_WALLET_BIN=$WALLET" >> "$GITHUB_ENV"
          echo "KTH_WALLET_IMAGE=$IMAGE" >> "$GITHUB_ENV"
        shell: bash
      # Row 1017: the peer wallet driver, run in the image it was built in.
      - name: Find the peer wallet driver
        if: matrix.peer_wallet
        run: |
          DRIVER=$(find kth-src/build -name kth_peer_wallet_e2e -type f -perm -u+x | head -1)
          echo "peer wallet driver: $DRIVER"
          echo "KTH_PEER_WALLET_BIN=$DRIVER" >> "$GITHUB_ENV"
          echo "KTH_PEER_WALLET_IMAGE=$IMAGE" >> "$GITHUB_ENV"
        shell: bash
      # Row 1013: a Fulcrum release, pinned by version and SHA-256, on BCHN.
      - name: Fetch Fulcrum 2.1.4
        if: matrix.fulcrum
        run: |
          TARBALL=Fulcrum-2.1.4-x86_64-linux.tar.gz
          SHA256=faf7cb36266c1694c834ad551d9592c0aef357bca66fdb5efdfe0d131c4b38ae
          curl -fsSLO --retry 6 --retry-delay 10 --retry-all-errors "https://github.com/cculianu/Fulcrum/releases/download/v2.1.4/$TARBALL"
          echo "$SHA256  $TARBALL" | sha256sum -c
          mkdir -p fulcrum && tar xzf "$TARBALL" -C fulcrum --strip-components=1
          ls -l fulcrum
          echo "KTH_FULCRUM_BIN=$PWD/fulcrum/Fulcrum" >> "$GITHUB_ENV"
        shell: bash
      - name: Run the end-to-end checks against this kth
        if: matrix.e2e != false
        run: python3 scripts/knuth_rpc_e2e.py e2e-out
        env:
          KTH_SV2: ${{ matrix.sv2 && '1' || '0' }}
          KTH_NOISE: ${{ matrix.noise && '1' || '0' }}
          KTH_I2P: ${{ matrix.i2p && '1' || '0' }}
          KTH_SERVE: ${{ matrix.serve && '1' || '0' }}
          KTH_ANNOUNCE: ${{ matrix.announce && '1' || '0' }}
          KTH_COMPACT: ${{ matrix.compact && '1' || '0' }}
          KTH_SV2_MINING: ${{ matrix.sv2_mining && '1' || '0' }}
          KTH_LONGPOLL: ${{ matrix.longpoll && '1' || '0' }}
          KTH_PROXY: ${{ matrix.proxy && '1' || '0' }}
          KTH_SHV: ${{ matrix.shv && '1' || '0' }}
          KTH_FILTERS: ${{ matrix.filters && '1' || '0' }}
          KTH_BLOOM: ${{ matrix.bloom && '1' || '0' }}
          KTH_SCRIPT_FILTERS: ${{ matrix.script_filters && '1' || '0' }}
          KTH_RPA_FILTERS: ${{ matrix.rpa_filters && '1' || '0' }}
          KTH_NEUTRINO_BIN: ${{ matrix.neutrino && format('{0}/neutrino-client', github.workspace) || '' }}
          KTH_BCHD_BIN: ${{ matrix.bchd && format('{0}/bchd', github.workspace) || '' }}
          KTH_RPA_NEUTRINO_BIN: ${{ matrix.bchd && format('{0}/rpa-neutrino-client', github.workspace) || '' }}
          KTH_EXPLORER_BACKEND: ${{ matrix.explorer_p2p && format('{0}/explorer/backend', github.workspace) || '' }}
          KTH_STALL: ${{ matrix.stall && '1' || '0' }}
          KTH_LONG: ${{ matrix.long || '0' }}
          KTH_NODE_WALLET: ${{ matrix.node_wallet && '1' || '0' }}
        shell: bash
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kth-${{ matrix.name }}
          path: |
            kth-commit.txt
            bchd-commit.txt
            explorer-commit.txt
            e2e-out/fulcrum.log
            test-status.txt
            node-tests.log
            domain-tests.log
            capi-tests.log
            blockchain-tests.log
            network-tests.log
            infrastructure-tests.log
            kth_*_test.log
            e2e-out
          if-no-files-found: ignore
      - name: Fail when a kth test suite failed
        run: |
          cat test-status.txt
          ! grep -v ' exit 0$' test-status.txt
        shell: bash
