name: kth integrated SV2 stack against BCH P2Pool

# Build the integrated kth branch once, then run the positive JD, large
# template, worker-name and Template Distribution rows against pinned P2Pool.
# Row 25 is an older no-payout-extension negative control and is not run on
# this branch, which implements that extension.
# Runs when this file changes, or by hand.
on:
  push:
    branches: [test/sv2-stack-20261110]
    paths: [.github/workflows/kth-jd.yml, scripts/jd_p2pool_e2e.py, scripts/patch_mining_device.py]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  row:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sv2-stack-20261110
            branch: test/sv2-stack-20261110
            p2pool: alpha
            p2pool_tests: true
    name: kth ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The toolchain is this Docker Hub digest; the steps take the repo's copy
      # of it (ci-deps.yml) when that copy's label carries the same digest, and
      # set IMAGE to the one they use.
      HUB_IMAGE: kthnode/gcc16-ubuntu24.04@sha256:cde0d8a8b911ba290e4019fa4fac81723c7cae93cd864e509fd93a7c05d25dfe
      P2POOL_COMMIT: 5b67ca11a1485c7f366672a30d5b1d1c7e883f25
      # Copies of BCHN, the toolchains and kth's Conan packages (ci-deps.yml).
      CI_DEPS: ghcr.io/bitcoincash1/knuth-ci-deps
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Make room for the build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        shell: bash
      # Without it every copy below is missing, and each falls back.
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pick the toolchain image
        run: |
          COPY="$CI_DEPS:toolchain-gcc16"
          IMAGE="$HUB_IMAGE"
          if docker pull --quiet --platform linux/amd64 "$COPY" \
            && [ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$COPY")" = "${HUB_IMAGE#*@}" ]; then
            IMAGE="$COPY"
          else
            echo "no copy of $HUB_IMAGE in $CI_DEPS; using Docker Hub's"
            docker rmi "$COPY" >/dev/null 2>&1 || true
          fi
          echo "toolchain image: $IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        shell: bash
      - name: Fetch kth ${{ matrix.branch }}
        run: |
          git clone --depth 1 --branch "${{ matrix.branch }}" https://github.com/CyberAshven/kth.git kth-src
          git -C kth-src log -1 --format='%H %s' | tee kth-commit.txt
        shell: bash
      # The packages ci-deps.yml keeps for this lock file and compiler: the
      # build restores them into the Conan cache, and conan install then finds
      # everything there without the package registry. Without them the build
      # goes on as before, from the actions cache below and the registry.
      - name: Fetch the kept Conan packages
        run: |
          mkdir -p conan2
          if HASH=$(cat kth-src/conan.lock kth-src/conanfile.py | sha256sum | cut -d' ' -f1); then
            REF="$CI_DEPS:conan-gcc16-$HASH"
            if docker pull --quiet "$REF" && id=$(docker create "$REF" /x); then
              docker cp "$id:/kth-conan.tgz" conan2/kth-conan.tgz || rm -f conan2/kth-conan.tgz
              docker rm "$id" >/dev/null || true
            fi
            docker rmi "$REF" >/dev/null 2>&1 || true
          fi
          if [ -f conan2/kth-conan.tgz ]; then
            echo "Conan packages from $REF"
          else
            echo "no kept Conan packages for this lock file; using the actions cache and the registry"
          fi
        shell: bash
      # The Conan packages kth-rows saves for the same lock file and compiler, so
      # a run needs the package registry only when the lock file changes.
      - name: Restore the Conan packages
        id: restore-conan
        uses: actions/cache/restore@v6
        with:
          path: conan2
          key: kth-conan2v2-gcc16-${{ hashFiles('kth-src/conan.lock', 'kth-src/conanfile.py') }}
          restore-keys: |
            kth-conan2v2-gcc16-
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: kth-ccache-gcc16-${{ matrix.branch }}-${{ github.run_id }}
          restore-keys: |
            kth-ccache-gcc16-${{ matrix.branch }}-
            kth-ccache-gcc16-
      - name: Build kth and its tests in the kth toolchain
        run: |
          TARGETS="kth_node_test node-exe"
          if [ "${{ matrix.domain }}" = "true" ]; then TARGETS="$TARGETS kth_domain_test"; fi
          if [ "${{ matrix.blockchain }}" = "true" ]; then TARGETS="$TARGETS kth_blockchain_test"; fi
          if [ "${{ matrix.network }}" = "true" ]; then TARGETS="$TARGETS kth_network_test"; fi
          if [ "${{ matrix.infrastructure }}" = "true" ]; then TARGETS="$TARGETS kth_infrastructure_test"; fi
          mkdir -p ccache conan2
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -v "$PWD/ccache:/ccache" \
            -v "$PWD/conan2:/root/.conan2" -w /src \
            -e TARGETS="$TARGETS" -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=4G -e CCACHE_BASEDIR=/src \
            -e CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros "$IMAGE" \
            bash -euo pipefail -c '
              LAUNCH=""
              if command -v ccache >/dev/null || (apt-get update -qq && apt-get install -y -qq ccache >/dev/null); then
                LAUNCH="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
                ccache -z
              fi
              pip install --no-cache-dir --upgrade "conan>=2.25,<3" "kthbuild>=4,<5"
              conan profile detect --force
              # The package registry has short outages; retry instead of failing the run.
              printf "core.net.http:max_retries=8\ncore.net.http:timeout=60\n" >> "$(conan config home)/global.conf"
              conan remote add kth https://packages.kth.cash/api/ --force
              # The kept packages, when the step above found them.
              if [ -f /root/.conan2/kth-conan.tgz ]; then
                conan cache restore /root/.conan2/kth-conan.tgz >/dev/null \
                  || echo "restoring the kept Conan packages failed; conan install uses the registry"
                rm -f /root/.conan2/kth-conan.tgz
              fi
              time conan install conanfile.py --version 1.6.1 -of build --build=missing \
                -o currency=BCH -o rpc=jsonrpc -o tests=True \
                -o "utxoz/*:with_tests=False" -o "utxoz/*:with_benchmarks=False" \
                -o "utxoz/*:with_large_benchmarks=False" \
                -s compiler.cppstd=23 -s build_type=Release
              cmake --preset conan-release -DGLOBAL_BUILD=ON -DENABLE_TEST=ON -DCMAKE_BUILD_TYPE=Release $LAUNCH
              time cmake --build --preset conan-release -j"$(nproc)" --target $TARGETS
              if [ -n "$LAUNCH" ]; then ccache -s; fi
              conan cache clean "*" --source --build --download --temp || true
              chmod -R a+rwX /ccache /root/.conan2
            '
        shell: bash
      - name: Save the Conan packages
        if: success() && steps.restore-conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: conan2
          key: kth-conan2v2-gcc16-${{ hashFiles('kth-src/conan.lock', 'kth-src/conanfile.py') }}
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ccache
          key: kth-ccache-gcc16-${{ matrix.branch }}-${{ github.run_id }}
      - name: Fetch BCHN 29.2.0
        run: |
          TARBALL=bitcoin-cash-node-29.2.0-x86_64-linux-gnu.tar.gz
          SHA256=23bbe9ff749136a9b832a2a59023ce76a5391322c1ea2f4f24b5b91f035081bc
          # The repo's copy (ci-deps.yml) first, then BCHN's release.
          if docker pull --quiet "$CI_DEPS:bchn-29.2.0" && id=$(docker create "$CI_DEPS:bchn-29.2.0" /x); then
            docker cp "$id:/$TARBALL" . || true
            docker rm "$id" >/dev/null || true
          fi
          if ! echo "$SHA256  $TARBALL" | sha256sum -c; then
            echo "no good copy in $CI_DEPS; fetching BCHN's release"
            rm -f "$TARBALL"
            curl -fsSLO --retry 6 --retry-delay 10 --retry-all-errors "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/v29.2.0/$TARBALL"
            echo "$SHA256  $TARBALL" | sha256sum -c
          fi
          tar xzf "$TARBALL"
          echo "$PWD/bitcoin-cash-node-29.2.0/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Fetch SRI's mining_device (sv2-apps, pinned)
        run: |
          sudo apt-get install -y -qq capnproto libcapnp-dev >/dev/null
          git clone --quiet https://github.com/stratum-mining/sv2-apps.git sv2-apps
          git -C sv2-apps checkout --quiet ffad32eb11128b8e3cf9ff20604480c11e5cbfab
        shell: bash
      # TEST ONLY. SRI's mining_device searches one 2^32 nonce space per job:
      # mine() never rolls ntime or version. kth accepts ntime up to two hours
      # ahead (work.hpp line 38). P2Pool accepts ntime up to two hours ahead
      # (mining.rs lines 724-726). Its handle_set_extranonce_prefix is a
      # todo!() that panics when kth hands it the pool's extranonce prefix.
      # Patch the pinned tree, then build it.
      - name: Patch mining_device ntime roll and extranonce prefix (test only)
        run: python3 scripts/patch_mining_device.py sv2-apps/integration-tests/lib/mining_device/mod.rs
        shell: bash
      - name: Build SRI's mining_device (sv2-apps, pinned)
        run: cargo build --release --locked --manifest-path sv2-apps/Cargo.toml -p integration_tests_sv2 --bin mining_device
        shell: bash
      - name: Fetch BCH P2Pool ${{ matrix.p2pool }}
        run: |
          git init p2pool
          git -C p2pool remote add origin https://github.com/CyberAshven/BitcoinCash-p2poolv2.git
          git -C p2pool fetch --depth 1 origin "$P2POOL_COMMIT"
          git -C p2pool checkout --detach FETCH_HEAD
          test "$(git -C p2pool rev-parse HEAD)" = "$P2POOL_COMMIT"
          git -C p2pool log -1 --format='%H %s' | tee p2pool-commit.txt
        shell: bash
      - name: Build BCH P2Pool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            clang \
            cmake \
            git \
            libbz2-dev \
            liblz4-dev \
            libsnappy-dev \
            libssl-dev \
            libzmq3-dev \
            libzstd-dev \
            pkg-config \
            zlib1g-dev \
            ca-certificates
          # Run from the clone so rustup reads rust-toolchain.toml. -p builds
          # p2poolv2 and p2poolv2_cli; the workspace release profile is fat LTO.
          cd p2pool
          cargo build --release --locked -p p2poolv2_node
        shell: bash
      # P2Pool's library tests under stratum::sv2: the Template Distribution
      # client's, which also cover large_templates' messages, and the rest of
      # its SV2 server's. Line tables only, as P2Pool's rust.yml builds its
      # tests, so the debug build fits the runner's disk. A failure lets the
      # row run, and fails the job at the end.
      - name: Install nextest
        if: matrix.p2pool_tests
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      - name: Run BCH P2Pool's SV2 unit tests
        id: p2pool_tests
        if: matrix.p2pool_tests
        continue-on-error: true
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: |
          cd p2pool
          cargo nextest run --locked -p p2poolv2_lib --lib -E 'test(stratum::sv2::)' 2>&1 | tee ../p2pool-tests.log
        shell: bash
      - name: Run the Job Declaration check
        run: |
          KTH_BIN=$(find "$PWD/kth-src/build" -name kth -type f -perm -u+x -path '*node-exe*' -print -quit)
          if [ -z "$KTH_BIN" ]; then
            echo "missing kth node-exe binary under kth-src/build"
            exit 1
          fi
          export KTH_IMAGE="$IMAGE"
          export KTH_SRC="$PWD/kth-src"
          export KTH_BIN
          export P2POOL_BIN="$PWD/p2pool/target/release/p2poolv2"
          export P2POOL_CLI="$PWD/p2pool/target/release/p2poolv2_cli"
          export KTH_MINING_DEVICE="$PWD/sv2-apps/target/release/mining_device"
          echo "node binary: $KTH_BIN"
          for bin in "$P2POOL_BIN" "$P2POOL_CLI" "$KTH_MINING_DEVICE"; do
            if [ ! -x "$bin" ]; then
              echo "missing binary: $bin"
              exit 1
            fi
          done
          status=0
          for row in 25b 25c 25w tdp; do
            if KTH_JD_ROW="$row" python3 -u scripts/jd_p2pool_e2e.py "e2e-out/$row"; then
              echo "$row exit 0" | tee -a jd-status.txt
            else
              rc=$?
              echo "$row exit $rc" | tee -a jd-status.txt
              status=1
            fi
          done
          exit "$status"
        shell: bash
      - name: Require all four Job Declaration row artifacts to pass
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          errors = []
          for row in ("25b", "25c", "25w", "tdp"):
              path = Path("e2e-out") / row / "jd-p2pool-e2e.json"
              result = json.loads(path.read_text())
              if not isinstance(result, dict):
                  errors.append(f"Row {row} did not produce a result object")
                  continue
              assertions = result.get("assertions")
              if result.get("row") != row or result.get("ok") is not True or result.get("error") is not None:
                  errors.append(f"Row {row} is misidentified or failed")
              if not isinstance(assertions, dict) or not assertions:
                  errors.append(f"Row {row} has no assertion evidence")
              else:
                  required = {"extension_granted", "large_template", "large_block"} if row == "tdp" else {
                      "pool_accepted", "shares_accepted_total", "accepted_work", "pplns_block", "metrics_sats_matched",
                  }
                  if row == "25c":
                      required.add("large_template")
                  if row == "25w":
                      required.add("worker_name")
                  if not required.issubset(assertions):
                      errors.append(f"Row {row} is missing its required assertions: {sorted(required - assertions.keys())}")
                  for flag in (("extension_granted",) if row == "tdp" else ("pool_accepted", "metrics_sats_matched")):
                      if assertions.get(flag) is not True:
                          errors.append(f"Row {row} did not establish {flag}")
              for name in ("cleanup_error", "log_error"):
                  if name in result:
                      errors.append(f"Row {row} reports {name}: {result[name]}")
              print(f"Checked row {row} evidence")
          if errors:
              raise SystemExit("\n".join(errors))
          PY
        shell: bash
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kth-jd-${{ matrix.name }}
          path: |
            kth-commit.txt
            p2pool-commit.txt
            p2pool-tests.log
            jd-status.txt
            e2e-out
          if-no-files-found: error
      - name: Fail on BCH P2Pool's SV2 unit tests
        if: always() && steps.p2pool_tests.outcome == 'failure'
        run: |
          echo "BCH P2Pool's SV2 unit tests failed; see p2pool-tests.log in the artifact"
          exit 1
        shell: bash
