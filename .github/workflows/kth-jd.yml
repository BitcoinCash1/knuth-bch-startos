name: kth SV2 job declaration against BCH P2Pool

# Rows 25, 25b and 25c mine on BCHN regtest through kth's Job Declaration
# client against BCH P2Pool. Row tdp has no Job Declaration: P2Pool takes its
# templates from kth's Template Provider, and SRI's mining_device mines on
# P2Pool. Each kth branch has node/announce-blocks (#814) merged in so BCHN
# hears the blocks kth mines; kth master does not announce its own blocks yet.
# Build that kth with kth's toolchain, build BCH P2Pool, and run the row.
# A row with proposals set builds kth alone and compares its getblocktemplate
# proposals (BIP23) with BCHN's on one regtest chain (scripts/proposal_e2e.py).
# Runs when this file changes, or by hand.
on:
  push:
    paths: [.github/workflows/kth-jd.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  row:
    strategy:
      fail-fast: false
      matrix:
        include:
          # BIP23 proposals on kth rpc/getblocktemplate-proposal (k-nuth/kth
          # master 53ec7760 and the change): scripts/proposal_e2e.py sends the
          # same proposals to kth and to BCHN 29.2.0 on one regtest chain and
          # compares the answers one by one; kth's blockchain and node test
          # suites run on the same build. No P2Pool and no mining device.
          - name: proposals-vs-bchn
            branch: rpc/getblocktemplate-proposal
            proposals: true
            blockchain: true
            node_tests: true
          # Row 25w with P2Pool's own node set to kth instead of BCHN
          # (KTH_JD_POOL_NODE=kth), so P2Pool e3cf4c88 checks every
          # Full-Template job kth declares with a proposal to kth. Before:
          # the Start9 JD build test/kth-jd-reconnect (7856e9b8), whose
          # getblocktemplate is master's and refuses proposals; P2Pool must
          # refuse every declaration as invalid-template for 300 s
          # (KTH_JD_EXPECT=refused). After: the same build with the change
          # (test/kth-jd-proposal); P2Pool must accept the declarations,
          # count a share and pay a PPLNS block, with no invalid-template
          # refusal. kth's blockchain and node tests run on the after build.
          - name: pool-on-kth-before
            branch: test/kth-jd-reconnect
            row: "25w"
            p2pool: e3cf4c8872cbbc2940f44b91d8824da3a0cb0c94
            pool_node: kth
            expect: refused
          - name: pool-on-kth-after
            branch: test/kth-jd-proposal
            row: "25w"
            p2pool: e3cf4c8872cbbc2940f44b91d8824da3a0cb0c94
            pool_node: kth
            blockchain: true
            node_tests: true
    name: kth ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # The toolchain is this Docker Hub digest; the steps take the repo's copy
      # of it (ci-deps.yml) when that copy's label carries the same digest, and
      # set IMAGE to the one they use.
      HUB_IMAGE: kthnode/gcc16-ubuntu24.04@sha256:cde0d8a8b911ba290e4019fa4fac81723c7cae93cd864e509fd93a7c05d25dfe
      # Copies of BCHN, the toolchains and kth's Conan packages (ci-deps.yml).
      CI_DEPS: ghcr.io/bitcoincash1/knuth-ci-deps
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Make room for the build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        shell: bash
      # Without it every copy below is missing, and each falls back.
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pick the toolchain image
        run: |
          COPY="$CI_DEPS:toolchain-gcc16"
          IMAGE="$HUB_IMAGE"
          if docker pull --quiet --platform linux/amd64 "$COPY" \
            && [ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$COPY")" = "${HUB_IMAGE#*@}" ]; then
            IMAGE="$COPY"
          else
            echo "no copy of $HUB_IMAGE in $CI_DEPS; using Docker Hub's"
            docker rmi "$COPY" >/dev/null 2>&1 || true
          fi
          echo "toolchain image: $IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        shell: bash
      - name: Fetch kth ${{ matrix.branch }}
        run: |
          git clone --depth 1 --branch "${{ matrix.branch }}" https://github.com/CyberAshven/kth.git kth-src
          git -C kth-src log -1 --format='%H %s' | tee kth-commit.txt
        shell: bash
      # The packages ci-deps.yml keeps for this lock file and compiler: the
      # build restores them into the Conan cache, and conan install then finds
      # everything there without the package registry. Without them the build
      # goes on as before, from the actions cache below and the registry.
      - name: Fetch the kept Conan packages
        run: |
          mkdir -p conan2
          if HASH=$(cat kth-src/conan.lock kth-src/conanfile.py | sha256sum | cut -d' ' -f1); then
            REF="$CI_DEPS:conan-gcc16-$HASH"
            if docker pull --quiet "$REF" && id=$(docker create "$REF" /x); then
              docker cp "$id:/kth-conan.tgz" conan2/kth-conan.tgz || rm -f conan2/kth-conan.tgz
              docker rm "$id" >/dev/null || true
            fi
            docker rmi "$REF" >/dev/null 2>&1 || true
          fi
          if [ -f conan2/kth-conan.tgz ]; then
            echo "Conan packages from $REF"
          else
            echo "no kept Conan packages for this lock file; using the actions cache and the registry"
          fi
        shell: bash
      # The Conan packages kth-rows saves for the same lock file and compiler, so
      # a run needs the package registry only when the lock file changes.
      - name: Restore the Conan packages
        id: restore-conan
        uses: actions/cache/restore@v6
        with:
          path: conan2
          key: kth-conan2v2-gcc16-${{ hashFiles('kth-src/conan.lock', 'kth-src/conanfile.py') }}
          restore-keys: |
            kth-conan2v2-gcc16-
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ccache
          key: kth-jd-ccache-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            kth-jd-ccache-${{ matrix.name }}-
            kth-jd-ccache-
      - name: Build kth and its tests in the kth toolchain
        run: |
          TARGETS="kth_node_test node-exe"
          if [ "${{ matrix.domain }}" = "true" ]; then TARGETS="$TARGETS kth_domain_test"; fi
          if [ "${{ matrix.blockchain }}" = "true" ]; then TARGETS="$TARGETS kth_blockchain_test"; fi
          if [ "${{ matrix.network }}" = "true" ]; then TARGETS="$TARGETS kth_network_test"; fi
          if [ "${{ matrix.infrastructure }}" = "true" ]; then TARGETS="$TARGETS kth_infrastructure_test"; fi
          mkdir -p ccache conan2
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -v "$PWD/ccache:/ccache" \
            -v "$PWD/conan2:/root/.conan2" -w /src \
            -e TARGETS="$TARGETS" -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=1200M -e CCACHE_BASEDIR=/src "$IMAGE" \
            bash -euo pipefail -c '
              LAUNCH=""
              if command -v ccache >/dev/null || (apt-get update -qq && apt-get install -y -qq ccache >/dev/null); then
                LAUNCH="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
                ccache -z
              fi
              pip install --no-cache-dir --upgrade "conan>=2.25,<3" "kthbuild>=4,<5"
              conan profile detect --force
              # The package registry has short outages; retry instead of failing the run.
              printf "core.net.http:max_retries=8\ncore.net.http:timeout=60\n" >> "$(conan config home)/global.conf"
              conan remote add kth https://packages.kth.cash/api/ --force
              # The kept packages, when the step above found them.
              if [ -f /root/.conan2/kth-conan.tgz ]; then
                conan cache restore /root/.conan2/kth-conan.tgz >/dev/null \
                  || echo "restoring the kept Conan packages failed; conan install uses the registry"
                rm -f /root/.conan2/kth-conan.tgz
              fi
              # Since k-nuth/kth#794 the rpc option names a backend; older
              # branches still take True.
              RPC=True
              if grep -q -F "\"rpc\": [\"jsonrpc\"" conanfile.py; then RPC=jsonrpc; fi
              time conan install conanfile.py --version 1.5.2 -of build --build=missing \
                -o currency=BCH -o rpc=$RPC -o tests=True \
                -o "utxoz/*:with_tests=False" -o "utxoz/*:with_benchmarks=False" \
                -o "utxoz/*:with_large_benchmarks=False" \
                -s compiler.cppstd=23 -s build_type=Release
              cmake --preset conan-release -DGLOBAL_BUILD=ON -DENABLE_TEST=ON -DCMAKE_BUILD_TYPE=Release $LAUNCH
              time cmake --build --preset conan-release -j"$(nproc)" --target $TARGETS
              if [ -n "$LAUNCH" ]; then ccache -s; fi
              conan cache clean "*" --source --build --download --temp || true
              chmod -R a+rwX /ccache /root/.conan2
            '
        shell: bash
      # kth's node test suite on the built tree, as kth-rows.yml runs it. A
      # failure lets the row run, and fails the job at the end.
      - name: Run kth's node tests
        id: node_tests
        if: matrix.node_tests
        continue-on-error: true
        run: |
          TEST=$(find kth-src/build -name kth_node_test -type f -perm -u+x | head -1)
          if [ -z "$TEST" ]; then echo "missing kth_node_test under kth-src/build"; exit 1; fi
          rc=0
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE" \
            bash -c "timeout --kill-after=30 1200 ./kth_node_test --reporter compact" > node-tests.log 2>&1 || rc=$?
          tail -5 node-tests.log
          echo "kth_node_test exit $rc"
          exit $rc
        shell: bash
      # kth's blockchain test suite on the built tree, as kth-rows.yml runs
      # it. A failure lets the row run, and fails the job at the end.
      - name: Run kth's blockchain tests
        id: blockchain_tests
        if: matrix.blockchain
        continue-on-error: true
        run: |
          TEST=$(find kth-src/build -name kth_blockchain_test -type f -perm -u+x | head -1)
          if [ -z "$TEST" ]; then echo "missing kth_blockchain_test under kth-src/build"; exit 1; fi
          rc=0
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -w "/src/$(dirname "${TEST#kth-src/}")" "$IMAGE"             bash -c "timeout --kill-after=30 1800 ./kth_blockchain_test --reporter compact" > blockchain-tests.log 2>&1 || rc=$?
          tail -5 blockchain-tests.log
          echo "kth_blockchain_test exit $rc"
          exit $rc
        shell: bash
      - name: Save the Conan packages
        if: success() && steps.restore-conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: conan2
          key: kth-conan2v2-gcc16-${{ hashFiles('kth-src/conan.lock', 'kth-src/conanfile.py') }}
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ccache
          key: kth-jd-ccache-${{ matrix.name }}-${{ github.run_id }}
      - name: Fetch BCHN 29.2.0
        run: |
          TARBALL=bitcoin-cash-node-29.2.0-x86_64-linux-gnu.tar.gz
          SHA256=23bbe9ff749136a9b832a2a59023ce76a5391322c1ea2f4f24b5b91f035081bc
          # The repo's copy (ci-deps.yml) first, then BCHN's release.
          if docker pull --quiet "$CI_DEPS:bchn-29.2.0" && id=$(docker create "$CI_DEPS:bchn-29.2.0" /x); then
            docker cp "$id:/$TARBALL" . || true
            docker rm "$id" >/dev/null || true
          fi
          if ! echo "$SHA256  $TARBALL" | sha256sum -c; then
            echo "no good copy in $CI_DEPS; fetching BCHN's release"
            rm -f "$TARBALL"
            curl -fsSLO --retry 6 --retry-delay 10 --retry-all-errors "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/v29.2.0/$TARBALL"
            echo "$SHA256  $TARBALL" | sha256sum -c
          fi
          tar xzf "$TARBALL"
          echo "$PWD/bitcoin-cash-node-29.2.0/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Fetch SRI's mining_device (sv2-apps, pinned)
        if: ${{ !matrix.proposals }}
        run: |
          sudo apt-get install -y -qq capnproto libcapnp-dev >/dev/null
          git clone --quiet https://github.com/stratum-mining/sv2-apps.git sv2-apps
          git -C sv2-apps checkout --quiet ffad32eb11128b8e3cf9ff20604480c11e5cbfab
        shell: bash
      # TEST ONLY. SRI's mining_device searches one 2^32 nonce space per job:
      # mine() never rolls ntime or version. kth accepts ntime up to two hours
      # ahead (work.hpp line 38). P2Pool accepts ntime up to two hours ahead
      # (mining.rs lines 724-726). Its handle_set_extranonce_prefix is a
      # todo!() that panics when kth hands it the pool's extranonce prefix.
      # Patch the pinned tree, then build it.
      - name: Patch mining_device ntime roll and extranonce prefix (test only)
        if: ${{ !matrix.proposals }}
        run: python3 scripts/patch_mining_device.py sv2-apps/integration-tests/lib/mining_device/mod.rs
        shell: bash
      - name: Build SRI's mining_device (sv2-apps, pinned)
        if: ${{ !matrix.proposals }}
        run: cargo build --release --locked --manifest-path sv2-apps/Cargo.toml -p integration_tests_sv2 --bin mining_device
        shell: bash
      # A branch name, or a full commit id such as the one a live node runs.
      - name: Fetch BCH P2Pool ${{ matrix.p2pool }}
        if: ${{ !matrix.proposals }}
        run: |
          REF="${{ matrix.p2pool }}"
          URL=https://github.com/CyberAshven/BitcoinCash-p2poolv2.git
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            git init --quiet p2pool
            git -C p2pool fetch --quiet --depth 1 "$URL" "$REF"
            git -C p2pool checkout --quiet FETCH_HEAD
          else
            git clone --depth 1 --branch "$REF" "$URL" p2pool
          fi
          git -C p2pool log -1 --format='%H %s' | tee p2pool-commit.txt
        shell: bash
      - name: Build BCH P2Pool
        if: ${{ !matrix.proposals }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            clang \
            cmake \
            git \
            libbz2-dev \
            liblz4-dev \
            libsnappy-dev \
            libssl-dev \
            libzmq3-dev \
            libzstd-dev \
            pkg-config \
            zlib1g-dev \
            ca-certificates
          # Run from the clone so rustup reads rust-toolchain.toml. -p builds
          # p2poolv2 and p2poolv2_cli; the workspace release profile is fat LTO.
          cd p2pool
          cargo build --release --locked -p p2poolv2_node
        shell: bash
      # P2Pool's library tests under stratum::sv2: the Template Distribution
      # client's, which also cover large_templates' messages, and the rest of
      # its SV2 server's. Line tables only, as P2Pool's rust.yml builds its
      # tests, so the debug build fits the runner's disk. A failure lets the
      # row run, and fails the job at the end.
      - name: Run BCH P2Pool's SV2 unit tests
        id: p2pool_tests
        if: matrix.p2pool_tests
        continue-on-error: true
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: |
          cd p2pool
          cargo test --locked -p p2poolv2_lib --lib -- stratum::sv2:: 2>&1 | tee ../p2pool-tests.log
        shell: bash
      - name: Delay P2Pool's SV2 port
        if: matrix.delay_ms
        run: |
          # kth runs with host networking and dials 127.0.0.1:3336, so the delay sits
          # on the loopback device, on TCP port 3336 alone: BCHN, RPC and the mining
          # device's connection to kth are untouched. No delay, no test: any failure
          # here fails the job.
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || true
          sudo modprobe sch_netem
          sudo tc qdisc add dev lo root handle 1: prio bands 4
          sudo tc qdisc add dev lo parent 1:4 handle 40: netem delay ${{ matrix.delay_ms }}ms
          sudo tc filter add dev lo protocol ip parent 1:0 prio 1 u32 match ip protocol 6 0xff match ip dport 3336 0xffff flowid 1:4
          sudo tc filter add dev lo protocol ip parent 1:0 prio 1 u32 match ip protocol 6 0xff match ip sport 3336 0xffff flowid 1:4
          sudo tc -s qdisc show dev lo
        shell: bash
      - name: Run the Job Declaration check
        if: ${{ !matrix.proposals }}
        run: |
          KTH_BIN=$(find "$PWD/kth-src/build" -name kth -type f -perm -u+x -path '*node-exe*' -print -quit)
          if [ -z "$KTH_BIN" ]; then
            echo "missing kth node-exe binary under kth-src/build"
            exit 1
          fi
          export KTH_IMAGE="$IMAGE"
          export KTH_JD_ROW="${{ matrix.row }}"
          export KTH_JD_PROXY="${{ matrix.proxy && '1' || '0' }}"
          export KTH_JD_SOAK_SECONDS="${{ matrix.soak || '0' }}"
          export KTH_JD_MODE="${{ matrix.mode || 'full-template' }}"
          export KTH_JD_WATCH_SECONDS="${{ matrix.watch || '0' }}"
          export KTH_JD_RESTART_GAPS="${{ matrix.restart_gaps || '' }}"
          export KTH_JD_RESTART_DEVICE="${{ matrix.restart_device || '1' }}"
          export KTH_JD_POOL_NODE="${{ matrix.pool_node || 'bchn' }}"
          export KTH_JD_EXPECT="${{ matrix.expect || 'accepted' }}"
          export KTH_SRC="$PWD/kth-src"
          export KTH_BIN
          export P2POOL_BIN="$PWD/p2pool/target/release/p2poolv2"
          export P2POOL_CLI="$PWD/p2pool/target/release/p2poolv2_cli"
          export KTH_MINING_DEVICE="$PWD/sv2-apps/target/release/mining_device"
          echo "node binary: $KTH_BIN"
          for bin in "$P2POOL_BIN" "$P2POOL_CLI" "$KTH_MINING_DEVICE"; do
            if [ ! -x "$bin" ]; then
              echo "missing binary: $bin"
              exit 1
            fi
          done
          rc=0; python3 -u scripts/jd_p2pool_e2e.py e2e-out || rc=$?
          if [ -n "${{ matrix.delay_ms }}" ]; then sudo tc -s qdisc show dev lo | tee e2e-out/netem.txt; fi
          exit $rc
        shell: bash
      - name: Run the proposal comparison
        if: matrix.proposals
        run: |
          KTH_BIN=$(find "$PWD/kth-src/build" -name kth -type f -perm -u+x -path '*node-exe*' -print -quit)
          if [ -z "$KTH_BIN" ]; then
            echo "missing kth node-exe binary under kth-src/build"
            exit 1
          fi
          export KTH_IMAGE="$IMAGE"
          export KTH_SRC="$PWD/kth-src"
          export KTH_BIN
          python3 -u scripts/proposal_e2e.py e2e-out
        shell: bash
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kth-jd-${{ matrix.name }}
          path: |
            kth-commit.txt
            p2pool-commit.txt
            p2pool-tests.log
            node-tests.log
            blockchain-tests.log
            e2e-out
          if-no-files-found: error
      - name: Fail on kth's node tests
        if: always() && steps.node_tests.outcome == 'failure'
        run: |
          echo "kth_node_test failed; see node-tests.log in the artifact"
          exit 1
        shell: bash
      - name: Fail on kth's blockchain tests
        if: always() && steps.blockchain_tests.outcome == 'failure'
        run: |
          echo "kth_blockchain_test failed; see blockchain-tests.log in the artifact"
          exit 1
        shell: bash
      - name: Fail on BCH P2Pool's SV2 unit tests
        if: always() && steps.p2pool_tests.outcome == 'failure'
        run: |
          echo "BCH P2Pool's SV2 unit tests failed; see p2pool-tests.log in the artifact"
          exit 1
        shell: bash
