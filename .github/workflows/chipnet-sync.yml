name: Knuth chipnet sync crash check

# TEST ONLY branch, never merged. Fast-syncs chipnet with the same kth image
# the end-to-end run builds (cached from that run), under gdb, to see whether
# the crashes seen on StartOS (SIGSEGV, glibc heap-corruption aborts) happen on
# other hardware, and to get a backtrace when they do.
on:
  push:
    branches: [knuth-rpc-e2e]
    paths: [.github/workflows/chipnet-sync.yml]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore the kth image built from this Dockerfile
        id: image
        uses: actions/cache/restore@v6
        with:
          path: /tmp/knuth-e2e.tar
          key: knuth-e2e-${{ hashFiles('Dockerfile') }}
          fail-on-cache-miss: false
      - name: Load the kth image, or build it
        run: |
          if [ -f /tmp/knuth-e2e.tar ]; then
            docker load -i /tmp/knuth-e2e.tar
          else
            VERSION=$(sed -nE 's/^ARG KNUTH_VERSION=(.*)$/\1/p' Dockerfile)
            docker build --platform linux/amd64 --build-arg "KNUTH_VERSION=$VERSION" --tag knuth-e2e .
          fi
          printf 'FROM knuth-e2e\nRUN apt-get update && apt-get install -y --no-install-recommends gdb && rm -rf /var/lib/apt/lists/*\n' \
            | docker build --platform linux/amd64 --tag knuth-gdb -
        shell: bash
      - name: Sync chipnet under gdb for up to 75 minutes
        run: |
          mkdir -p out
          # The package's chipnet settings: kth tells chipnet from testnet4 by
          # the inbound port, and Fulcrum and the Explorer need db_mode full.
          timeout 75m docker run --name kth --platform linux/amd64 --entrypoint gdb knuth-gdb \
            -batch -ex 'set pagination off' -ex 'handle SIGPIPE nostop noprint' -ex run \
            -ex 'echo \n=== crashing thread\n' -ex bt \
            -ex 'echo \n=== all threads\n' -ex 'thread apply all bt 12' \
            --args /usr/local/bin/kth --init_run --network chipnet --node.display daemon \
            --db.directory /data/chipnet --db.db_mode full \
            --net.inbound_port 48333 --net.inbound_connections 0 --net.outbound_connections 8 \
            > out/kth-gdb.log 2>&1 || echo "exit $?"
          grep -nE "SIGSEGV|SIGABRT|malloc|corrupt|double free|=== crashing" out/kth-gdb.log | head -20 || true
          echo "--- last sync progress"
          grep -E "UTXO built|contiguous" out/kth-gdb.log | tail -3 || true
          echo "--- tail"
          tail -80 out/kth-gdb.log
        shell: bash
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kth-chipnet-sync
          path: out
