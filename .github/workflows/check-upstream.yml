name: Check Upstream

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Until ghcr.io/k-nuth/kth ships with JSON-RPC (k-nuth/docker-images#7) the
      # Dockerfile compiles kth itself. The moment it does, switch to it.
      - name: Switch to the official image once it ships JSON-RPC
        id: image
        run: bash scripts/use-upstream-image.sh
        shell: bash

      - name: Release the switch
        if: steps.image.outputs.switched == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # GITHUB_TOKEN pushes do not start Tag and Release.
        run: gh workflow run tagAndRelease.yml
        shell: bash

      - name: Check for new upstream Knuth release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(gh release view --repo k-nuth/kth --json tagName -q '.tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then echo "Could not fetch upstream version"; exit 0; fi

          CURRENT=$(grep -E '^ARG KNUTH_VERSION=' Dockerfile | cut -d= -f2)
          if [ "${LATEST#v}" = "$CURRENT" ]; then echo "Already at $LATEST — no update"; exit 0; fi

          echo "Updating $CURRENT -> $LATEST"
          bash scripts/auto-bump.sh "$LATEST"
          # GITHUB_TOKEN pushes do not start Tag and Release.
          gh workflow run tagAndRelease.yml
        shell: bash
