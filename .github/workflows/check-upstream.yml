name: Check Upstream

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-release-update
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new upstream Knuth release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub's latest release endpoint excludes draft/prerelease tags.
          LATEST=$(gh api repos/k-nuth/kth/releases/latest --jq '.tag_name')
          bash scripts/auto-bump.sh "$LATEST"
          # Retry a missed/failed release dispatch even if the pins were already
          # committed by the preceding run.
          PACKAGE_VERSION=$(sed -nE "s/^[[:space:]]*version: '([^']+)'.*/\1/p" startos/versions/current.ts)
          [ -n "$PACKAGE_VERSION" ]
          PACKAGE_TAG="v${PACKAGE_VERSION/:/.}"
          if ! gh release view "$PACKAGE_TAG" >/dev/null 2>&1; then
            echo "release_required=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      # GITHUB_TOKEN pushes do not start another workflow automatically.
      - name: Build and release the validated update
        if: steps.upstream.outputs.updated == 'true' || steps.upstream.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run tagAndRelease.yml --ref master
        shell: bash
