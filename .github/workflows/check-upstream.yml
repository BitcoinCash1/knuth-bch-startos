name: Check Upstream

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a new upstream Knuth release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(gh release view --repo k-nuth/kth --json tagName -q '.tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then echo "Could not fetch upstream version"; exit 0; fi

          CURRENT=$(sed -nE 's/^ARG KNUTH_VERSION=(.*)$/\1/p' Dockerfile | head -1)
          if [ "${LATEST#v}" = "$CURRENT" ]; then
            echo "Already at $LATEST — no update"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "auto-bump/$LATEST" >/dev/null; then
            echo "A bump PR for $LATEST is already open — nothing to do"
            exit 0
          fi

          echo "Updating $CURRENT -> $LATEST"
          bash scripts/auto-bump.sh "$LATEST"
        shell: bash
