name: Keep the test workflows' downloads in the repo's registry

# TEST ONLY branch, never merged. kth-rows.yml, kth-jd.yml, kth-asan.yml and
# rpc-e2e.yml download BCHN from GitHub releases, kth's Conan packages from
# packages.kth.cash and kth's toolchain images from Docker Hub, and a run fails
# when any of them is down. This keeps a copy of each in ghcr.io, which does
# not expire like the actions cache; those workflows try the copy first and
# fall back to the original. Each copy is an image tag of
# ghcr.io/bitcoincash1/knuth-ci-deps:
# - bchn-29.2.0: FROM scratch, only /bitcoin-cash-node-29.2.0-x86_64-linux-gnu.tar.gz;
# - toolchain-gcc15, toolchain-gcc16: kth's toolchain images, the Docker Hub
#   digest they came from in the org.opencontainers.image.base.digest label;
# - conan-gcc<N>-<hash>: FROM scratch, only /kth-conan.tgz, which is
#   "conan cache save" of everything "conan install" fetched for that compiler,
#   where <hash> is
#     cat conan.lock conanfile.py | sha256sum | cut -d' ' -f1
#   of the kth branch. A tag already there is not made again.
# Runs when this file changes, or by hand for another kth branch's lock file.
on:
  push:
    branches: [knuth-rpc-e2e]
    paths: [.github/workflows/ci-deps.yml]
  workflow_dispatch:
    inputs:
      kth_branch:
        description: Branch of CyberAshven/kth whose Conan packages to keep
        type: string
        default: master

permissions:
  contents: read
  packages: write

env:
  CI_DEPS: ghcr.io/bitcoincash1/knuth-ci-deps

jobs:
  bchn:
    name: BCHN 29.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep BCHN 29.2.0
        run: |
          REF="$CI_DEPS:bchn-29.2.0"
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "$REF is already there"
            exit 0
          fi
          mkdir bchn
          cd bchn
          TARBALL=bitcoin-cash-node-29.2.0-x86_64-linux-gnu.tar.gz
          curl -fsSLO --retry 6 --retry-delay 10 --retry-all-errors "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/v29.2.0/$TARBALL"
          echo "23bbe9ff749136a9b832a2a59023ce76a5391322c1ea2f4f24b5b91f035081bc  $TARBALL" | sha256sum -c
          printf 'FROM scratch\nCOPY %s /%s\n' "$TARBALL" "$TARBALL" > Dockerfile
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.description=BCHN 29.2.0 release tarball for the TEST ONLY workflows" \
            -t "$REF" .
          docker push "$REF"
        shell: bash

  toolchains:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The digests kth-rows.yml, kth-jd.yml and kth-asan.yml pin.
          - gcc: "15"
            source: kthnode/gcc15-ubuntu24.04@sha256:4988fdeb3654c2b5ea591ffa4454f67e1a631549449c62e35060ba69da79eb67
          - gcc: "16"
            source: kthnode/gcc16-ubuntu24.04@sha256:cde0d8a8b911ba290e4019fa4fac81723c7cae93cd864e509fd93a7c05d25dfe
    name: toolchain gcc${{ matrix.gcc }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCC: ${{ matrix.gcc }}
      SOURCE: ${{ matrix.source }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep ${{ matrix.source }}
        run: |
          REF="$CI_DEPS:toolchain-gcc$GCC"
          DIGEST="${SOURCE#*@}"
          # Already there only when it was copied from this digest; a new digest
          # above replaces the tag.
          if docker buildx imagetools inspect "$REF" --format '{{json .Image}}' 2>/dev/null \
            | grep -qF "\"org.opencontainers.image.base.digest\":\"$DIGEST\""; then
            echo "$REF is already a copy of $SOURCE"
            exit 0
          fi
          docker pull --platform linux/amd64 "$SOURCE"
          # The same layers; only the labels are added.
          echo "FROM $SOURCE" | docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.base.name=docker.io/${SOURCE%@*}" \
            --label "org.opencontainers.image.base.digest=$DIGEST" \
            -t "$REF" -
          docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.base.digest" }}' "$REF" | grep -qxF "$DIGEST"
          docker push "$REF"
        shell: bash

  # In the toolchain copy, so the packages match the toolchain the other
  # workflows build in. Fails while packages.kth.cash is down.
  conan:
    needs: toolchains
    # One compiler's copy failing does not hold back the other's packages.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        gcc: ["15", "16"]
    name: conan gcc${{ matrix.gcc }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GCC: ${{ matrix.gcc }}
      KTH_BRANCH: ${{ inputs.kth_branch || 'master' }}
    steps:
      - name: Make room for the build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        shell: bash
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch kth ${{ env.KTH_BRANCH }}
        id: kth
        run: |
          git clone --depth 1 --branch "$KTH_BRANCH" https://github.com/CyberAshven/kth.git kth-src
          git -C kth-src log -1 --format='%H %s' | tee kth-commit.txt
          HASH=$(cat kth-src/conan.lock kth-src/conanfile.py | sha256sum | cut -d' ' -f1)
          REF="$CI_DEPS:conan-gcc$GCC-$HASH"
          echo "REF=$REF" >> "$GITHUB_ENV"
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "$REF is already there"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Fetch kth's Conan packages in the kth toolchain
        if: steps.kth.outputs.present != 'true'
        run: |
          mkdir -p out
          docker run --rm --platform linux/amd64 -v "$PWD/kth-src:/src" -v "$PWD/out:/out" -w /src \
            "$CI_DEPS:toolchain-gcc$GCC" \
            bash -euo pipefail -c '
              pip install --no-cache-dir --upgrade "conan>=2.25,<3" "kthbuild>=4,<5"
              conan profile detect --force
              # The package registry has short outages; retry instead of failing the run.
              printf "core.net.http:max_retries=8\ncore.net.http:timeout=60\n" >> "$(conan config home)/global.conf"
              conan remote add kth https://packages.kth.cash/api/ --force
              time conan install conanfile.py --version 1.5.2 -of build --build=missing \
                -o currency=BCH -o rpc=True -o tests=True \
                -o "utxoz/*:with_tests=False" -o "utxoz/*:with_benchmarks=False" \
                -o "utxoz/*:with_large_benchmarks=False" \
                -s compiler.cppstd=23 -s build_type=Release
              conan cache clean "*" --source --build --download --temp || true
              # Every recipe and binary now in the cache, for "conan cache restore".
              conan cache save "*:*" --file /out/kth-conan.tgz
              ls -l /out/kth-conan.tgz
              chmod a+r /out/kth-conan.tgz
            '
        shell: bash
      - name: Keep them in the registry
        if: steps.kth.outputs.present != 'true'
        run: |
          printf 'FROM scratch\nCOPY kth-conan.tgz /kth-conan.tgz\n' > out/Dockerfile
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.description=kth's Conan packages for GCC $GCC, for the TEST ONLY workflows" \
            --label "org.opencontainers.image.revision=$(cut -d' ' -f1 kth-commit.txt)" \
            -t "$REF" out
          docker push "$REF"
        shell: bash
