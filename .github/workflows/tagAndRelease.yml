name: Tag and Release

on:
  push:
    branches: ['master']
    paths-ignore: ['*.md']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # A registry outage can require the pinned upstream source build.
    timeout-minutes: 180
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup build environment
        uses: start9labs/shared-workflows/.github/actions/setup-build-env@master

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Load the package signing key
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          test -n "$DEV_KEY" || { echo "DEV_KEY must contain the stable package signing key" >&2; exit 1; }
          start-cli init-key
          mkdir -p .startos
          umask 077
          printf '%s' "$DEV_KEY" > .startos/build.key.pem
        shell: bash

      - name: Validate upstream binary and RPC
        run: |
          VERSION=$(sed -nE 's/^ARG KNUTH_VERSION=(.*)$/\1/p' Dockerfile)
          bash scripts/check-upstream-image.sh "$VERSION"
        shell: bash

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Build service package
        run: |
          RUST_LOG=debug RUST_BACKTRACE=1 make
          echo ""
          echo "SHA256SUMs:"
          sha256sum *.s9pk
        shell: bash

      - name: Generate changelog
        id: meta
        run: |
          FIRST_S9PK=$(ls *.s9pk | head -1)
          TITLE=$(start-cli s9pk inspect "$FIRST_S9PK" manifest | jq -r '.title')
          VERSION=$(start-cli s9pk inspect "$FIRST_S9PK" manifest | jq -r '.version')
          VERSION_TAG="v${VERSION/:/.}"
          RELEASE_NOTES=$(start-cli s9pk inspect "$FIRST_S9PK" manifest | jq -r '.releaseNotes // "No release notes provided." | if type == "object" then (.en_US // first(.[]) // "No release notes provided.") else . end')
          {
            echo "## What's Changed"
            echo ""
            echo "Version: ${VERSION} (${VERSION_TAG})"
            echo ""
            echo "${RELEASE_NOTES}"
            echo ""
            echo "## SHA256 Hashes"
            echo '```'
            sha256sum *.s9pk
            echo '```'
          } > change-log.txt
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vtag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create immutable release tag
        run: |
          TAG="${{ steps.meta.outputs.vtag }}"
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" != "$(git rev-parse HEAD)" ]; then
              echo "Release tag $TAG points at another commit; increase the packaging revision" >&2
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; increase the packaging revision" >&2
              exit 1
            fi
            echo "Completing the unpublished release for the existing tag"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.vtag }}
          name: ${{ steps.meta.outputs.title }} ${{ steps.meta.outputs.version }}
          prerelease: false
          body_path: change-log.txt
          files: ./*.s9pk
