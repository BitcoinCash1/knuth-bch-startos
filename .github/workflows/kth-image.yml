name: kth node image from a CyberAshven/kth branch

# TEST ONLY branch, never merged. Builds kth's node image from a branch of
# CyberAshven/kth with kth/source.Dockerfile from the feat/node-from-source
# branch of CyberAshven/docker-images (the change that has k-nuth/docker-images
# build ghcr.io/k-nuth/kth:master from source), checks `kth --version` in it,
# and publishes it as ghcr.io/bitcoincash1/kth:<branch>, where every character
# a Docker tag does not allow becomes "-". The Start9 package and the test
# workflows can then run a kth change before it lands on master. By hand only.
on:
  workflow_dispatch:
    inputs:
      kth_branch:
        description: Branch of CyberAshven/kth to build
        type: string
        default: master

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: kth image ${{ inputs.kth_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # A second run for the same branch waits, so an older build cannot
    # finish last and replace a newer one.
    concurrency:
      group: kth-image-${{ inputs.kth_branch }}
    steps:
      - name: Fetch docker-images feat/node-from-source
        uses: actions/checkout@v7
        with:
          repository: CyberAshven/docker-images
          ref: feat/node-from-source
          path: docker-images
          persist-credentials: false
      # Full history, for the release tag the version starts from.
      - name: Fetch kth ${{ inputs.kth_branch }}
        uses: actions/checkout@v7
        with:
          repository: CyberAshven/kth
          ref: ${{ inputs.kth_branch }}
          path: kth-src
          fetch-depth: 0
          persist-credentials: false
      - name: Name the image and the version
        id: meta
        working-directory: kth-src
        env:
          BRANCH: ${{ inputs.kth_branch }}
        run: |
          # [A-Za-z0-9_.-] only, not starting with "." or "-", 128 at most.
          TAG=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-128)
          if [ -z "$TAG" ]; then
            echo "::error::Branch '$BRANCH' gives no image tag"
            exit 1
          fi
          # The fork lacks upstream's newer release tags; the version starts
          # from the last one reachable, as build-node-from-source.yml does.
          git fetch --quiet --tags https://github.com/k-nuth/kth.git \
            || echo "could not fetch k-nuth/kth's tags; using the fork's"
          SHA=$(git rev-parse HEAD)
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          {
            echo "image=ghcr.io/bitcoincash1/kth:$TAG"
            echo "version=${LAST_TAG#v}-commit.${SHA:0:8}"
            echo "revision=$SHA"
          } >> "$GITHUB_OUTPUT"
          git log -1 --format='%H %s'
        shell: bash
      - name: Build the node image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ steps.meta.outputs.revision }}
          BRANCH: ${{ inputs.kth_branch }}
        run: |
          docker build --platform linux/amd64 \
            -f docker-images/kth/source.Dockerfile \
            --build-arg KNUTH_VERSION="$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.description=kth node from CyberAshven/kth $BRANCH for the TEST ONLY workflows" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            -t "$IMAGE" kth-src
        shell: bash
      - name: Check node version before publishing
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker run --rm --network none --entrypoint /usr/local/bin/kth "$IMAGE" --version
        shell: bash
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push "$IMAGE"
        shell: bash
