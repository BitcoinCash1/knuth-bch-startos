name: Knuth RPC end-to-end

# TEST ONLY branch, never merged. Builds kth from the package Dockerfile, syncs
# it from a BCHN regtest node, and runs every node call Fulcrum, BCH Explorer,
# ASICSeer and EloPool make against both nodes (scripts/knuth_rpc_e2e.py).
on:
  push:
    branches: [knuth-rpc-e2e]
    paths: [Dockerfile, scripts/knuth_rpc_e2e.py, .github/workflows/rpc-e2e.yml]

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # The copy of BCHN that ci-deps.yml keeps.
      CI_DEPS: ghcr.io/bitcoincash1/knuth-ci-deps
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Without it the copy of BCHN is missing, and the step falls back.
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore the kth image built from this Dockerfile
        id: image
        uses: actions/cache/restore@v6
        with:
          path: /tmp/knuth-e2e.tar
          key: knuth-e2e-${{ hashFiles('Dockerfile') }}
      - name: Build kth from the package Dockerfile
        if: steps.image.outputs.cache-hit != 'true'
        run: |
          VERSION=$(sed -nE 's/^ARG KNUTH_VERSION=(.*)$/\1/p' Dockerfile)
          echo "kth $VERSION"
          docker build --platform linux/amd64 --build-arg "KNUTH_VERSION=$VERSION" --tag knuth-e2e .
          docker save knuth-e2e -o /tmp/knuth-e2e.tar
        shell: bash
      - name: Keep the kth image for the next run
        if: steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/knuth-e2e.tar
          key: knuth-e2e-${{ hashFiles('Dockerfile') }}
      - name: Load the kept kth image
        if: steps.image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/knuth-e2e.tar
        shell: bash
      - name: Fetch BCHN 29.2.0
        run: |
          TARBALL=bitcoin-cash-node-29.2.0-x86_64-linux-gnu.tar.gz
          SHA256=23bbe9ff749136a9b832a2a59023ce76a5391322c1ea2f4f24b5b91f035081bc
          # The repo's copy (ci-deps.yml) first, then BCHN's release.
          if docker pull --quiet "$CI_DEPS:bchn-29.2.0" && id=$(docker create "$CI_DEPS:bchn-29.2.0" /x); then
            docker cp "$id:/$TARBALL" . || true
            docker rm "$id" >/dev/null || true
          fi
          if ! echo "$SHA256  $TARBALL" | sha256sum -c; then
            echo "no good copy in $CI_DEPS; fetching BCHN's release"
            rm -f "$TARBALL"
            curl -fsSLO --retry 6 --retry-delay 10 --retry-all-errors "https://github.com/bitcoin-cash-node/bitcoin-cash-node/releases/download/v29.2.0/$TARBALL"
            echo "$SHA256  $TARBALL" | sha256sum -c
          fi
          tar xzf "$TARBALL"
          echo "$PWD/bitcoin-cash-node-29.2.0/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Run the end-to-end checks
        run: python3 scripts/knuth_rpc_e2e.py e2e-out
        shell: bash
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: knuth-rpc-e2e
          path: e2e-out
